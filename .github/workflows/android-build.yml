name: android-apk

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/android-build.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install NDK r28 + CMake
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(command -v sdkmanager)"
          yes | "$SDKMANAGER" --install "ndk;28.2.13676358" "cmake;3.22.1" "platforms;android-36" "build-tools;35.0.0" > /dev/null
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build PRoot (native deps)
        run: ./deps/build_proot.sh

      - name: Prepare Alpine rootfs assets
        run: ./scripts/prepare_android_sandbox.sh

      - name: Build rclone .aar (gomobile)
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          export PATH="$PATH:$(go env GOPATH)/bin"
          gomobile init
          ./deps/build_rclone_android.sh
          mkdir -p src/android/app/libs
          cp deps/build/rclone/rclone.aar src/android/app/libs/

      - name: Configure build-time properties
        run: |
          cp src/android/app/provider-customization.properties.example \
             src/android/app/provider-customization.properties

      - name: Gradle assembleRelease
        working-directory: src/android
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: List APKs
        run: find src/android/app/build/outputs -name '*.apk' -printf '%p %s\n'

      - uses: actions/upload-artifact@v4
        with:
          name: minis-apk-release
          path: src/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error