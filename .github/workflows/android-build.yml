name: android-apk

on:
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Bump versionCode / versionName from run_number
        run: |
          GRADLE=src/android/app/build.gradle.kts
          # Stable base of 1000 so every custom build out-ranks upstream
          # (upstream versionCode is 49). run_number grows monotonically per
          # workflow, so each rebuild is a strict upgrade over the previous
          # one and Android offers in-place update with data preserved.
          CODE=$((1000 + ${{ github.run_number }}))
          NAME="1.15.14-custom.${{ github.run_number }}"
          sed -i -E "s/versionCode = [0-9]+/versionCode = $CODE/" "$GRADLE"
          sed -i -E "s/versionName = \"[^\"]+\"/versionName = \"$NAME\"/" "$GRADLE"
          grep -nE 'versionCode|versionName' "$GRADLE" | head -2
          echo "APP_VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "APP_VERSION_NAME=$NAME" >> "$GITHUB_ENV"

      - name: Restore fixed signing keystore
        env:
          CUSTOM_KEYSTORE_B64: ${{ secrets.CUSTOM_KEYSTORE_B64 }}
          CUSTOM_KEYSTORE_PASSWORD: ${{ secrets.CUSTOM_KEYSTORE_PASSWORD }}
          CUSTOM_KEY_ALIAS: ${{ secrets.CUSTOM_KEY_ALIAS }}
          CUSTOM_KEY_PASSWORD: ${{ secrets.CUSTOM_KEY_PASSWORD }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          echo "$CUSTOM_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/keys/custom.keystore"
          chmod 600 "$RUNNER_TEMP/keys/custom.keystore"
          {
            echo "CUSTOM_KEYSTORE_FILE=$RUNNER_TEMP/keys/custom.keystore"
            echo "CUSTOM_STORE_PASS=$CUSTOM_KEYSTORE_PASSWORD"
            echo "CUSTOM_KEY_ALIAS=$CUSTOM_KEY_ALIAS"
            echo "CUSTOM_KEY_PASS=$CUSTOM_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept licenses + install SDK packages
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358" "cmake;3.22.1" "platforms;android-36" "build-tools;35.0.0" > /dev/null

      - name: Cache jadx 1.5.1 archive
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/jadx-1.5.1.zip
          key: jadx-1.5.1-zip

      - name: Provide jadx 1.5.1 (slim build, GUI stripped) to toolchain
        run: |
          set -euo pipefail
          DEST=src/android/app/src/main/assets/toolchain/jars
          JAR="$DEST/jadx-1.5.1-all.jar"
          if [ -f "$JAR" ]; then echo "jadx jar already present"; exit 0; fi
          ZIP="$RUNNER_TEMP/jadx-1.5.1.zip"
          if [ ! -s "$ZIP" ]; then
            curl -sSL --retry 3 --retry-delay 2 -o "$ZIP" \
              https://github.com/skylot/jadx/releases/download/v1.5.1/jadx-1.5.1.zip
          fi
          rm -rf "$RUNNER_TEMP/jadx"
          mkdir -p "$RUNNER_TEMP/jadx" "$DEST"
          unzip -oq "$ZIP" 'lib/jadx-1.5.1-all.jar' -d "$RUNNER_TEMP/jadx"
          python3 .github/scripts/slim_jadx.py \
            "$RUNNER_TEMP/jadx/lib/jadx-1.5.1-all.jar" "$JAR"
          ls -lh "$JAR"
          unzip -l "$JAR" jadx/cli/JadxCLI.class

      - name: Build APK (uses resources already present in the source tree)
        working-directory: src/android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: |
          cp app/provider-customization.properties.example app/provider-customization.properties
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace \
            -Pminis.custom.keystore="$CUSTOM_KEYSTORE_FILE" \
            -Pminis.custom.storePass="$CUSTOM_STORE_PASS" \
            -Pminis.custom.keyAlias="$CUSTOM_KEY_ALIAS" \
            -Pminis.custom.keyPass="$CUSTOM_KEY_PASS"

      - name: Recompress DEX and re-sign APK (zopfli)
        run: |
          set -euo pipefail
          APK=src/android/app/build/outputs/apk/github/release/app-github-release.apk
          BT="$ANDROID_HOME/build-tools/35.0.0"
          BEFORE=$(stat -c%s "$APK")
          echo "before: $BEFORE bytes"

          python3 -m pip install --quiet zopfli 2>/dev/null \
            || python3 -m pip install --quiet --break-system-packages zopfli

          # Only deflate streams that actually gain: DEX, resources.arsc and
          # text assets. Already-compressed archives (tgz/jar/zip/so/png) are
          # copied byte-for-byte, which keeps this step at a few minutes.
          python3 .github/scripts/apk_recompress.py "$APK" -o "$RUNNER_TEMP/recompressed.apk" \
            --iterations 8 --jobs 4 | tee "$RUNNER_TEMP/recompress.log"

          # Recompressing rewrites the zip, so alignment and the signature are
          # gone: re-align, then re-sign with the same fixed keystore.
          "$BT/zipalign" -f -p 4 "$RUNNER_TEMP/recompressed.apk" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign \
            --ks "$CUSTOM_KEYSTORE_FILE" \
            --ks-pass "pass:$CUSTOM_STORE_PASS" \
            --key-pass "pass:$CUSTOM_KEY_PASS" \
            --ks-key-alias "$CUSTOM_KEY_ALIAS" \
            "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --verbose "$RUNNER_TEMP/aligned.apk" | head -6

          cp "$RUNNER_TEMP/aligned.apk" "$APK"
          AFTER=$(stat -c%s "$APK")
          echo "after:  $AFTER bytes ($(( (BEFORE-AFTER)/1024 )) KiB saved, $(( 100*(BEFORE-AFTER)/BEFORE ))%)"

      - name: Show outputs
        run: find src/android/app/build/outputs -name '*.apk' -printf '%p %s\n'

      - uses: actions/upload-artifact@v4
        with:
          name: minis-1.15.14-release
          path: src/android/app/build/outputs/apk/github/release/app-github-release.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: always() && hashFiles('src/android/app/build/outputs/apk/**/*.apk') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="v${APP_VERSION_NAME}"
          APK=src/android/app/build/outputs/apk/github/release/app-github-release.apk
          cp "$APK" /tmp/minis-custom.apk
          gh release create "$TAG" /tmp/minis-custom.apk \
            --title "Minis ${APP_VERSION_NAME} (code ${APP_VERSION_CODE})" \
            --notes "Build from ${GITHUB_REF_NAME} @ ${GITHUB_SHA:0:7}. Signed with the fixed custom keystore — installs in place over previous custom builds, data preserved." \
            --prerelease
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Show release URL
        if: env.RELEASE_TAG != ''
        run: echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
